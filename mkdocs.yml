site_name: safe-decode
site_url: https://securityronin.github.io/safe-decode/
repo_url: https://github.com/SecurityRonin/safe-decode
repo_name: SecurityRonin/safe-decode
theme:
  name: material
  features: [content.code.copy, navigation.top, search.highlight]
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc: { permalink: true }
nav:
  - Home: index.md
  - Purpose & Scope: PRD.md
  - Decisions:
      - One named function per NUL policy: decisions/0001-one-named-function-per-nul-policy.md
      - MultiSz and MRUListEx: decisions/0002-multisz-and-mrulistex-stay-with-the-registry.md
  - Privacy Policy: privacy.md
  - Terms of Service: terms.md
plugins: [search]
