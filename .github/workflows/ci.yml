name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@a62ab10603151071744cec0b4e3638aa6406d4e4
    with:
      # Carries across the existing gate verbatim. The hand-written coverage job
      # ran `cargo llvm-cov --fail-under-lines 100 --fail-under-functions 100
      # --show-missing-lines`. Stating the floor explicitly keeps the gate this
      # repo already passes rather than silently swapping in a differently
      # shaped one: the default `strict` gate is per-line with
      # `// cov:unreachable` exemptions, which is not what this repo enforces
      # today (it carries no such markers at all).
      #
      # The old job also passed `--ignore-filename-regex '(^|/)src/(main\.rs|bin/)'`.
      # That is deliberately NOT carried across: this repo ships no `src/main.rs`
      # and no `src/bin/`, so the pattern matched nothing and dropping it changes
      # no behaviour. (Verified against origin/main's file list.)
      coverage-gate: floor
      coverage-floor: 100

  # Repo-specific pre-publish gate with no equivalent in the reusable workflow,
  # and no other workflow here covers it (this repo has only ci/docs/release-plz).
  # Dropping it would silently retire a check that a published crate ships its
  # README and LICENSE. Copied verbatim from the hand-written ci.yml.
  package:
    name: Package completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - name: README + LICENSE packaged in every published crate
        run: |
          set -euo pipefail
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;[print(p['name']) for p in json.load(sys.stdin)['packages'] if p.get('publish') != []]")
          for p in $pkgs; do
            list=$(cargo package -p "$p" --list)
            echo "$list" | grep -qx 'README.md' || { echo "::error::$p does not package README.md"; exit 1; }
            echo "$list" | grep -q '^LICENSE'   || { echo "::error::$p does not package a LICENSE file"; exit 1; }
            echo "OK: $p packages README.md + LICENSE"
          done
